name: GitHub Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Light metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: heykatie
          filename: github-metrics-light.svg

          template: classic
          base: header
          base_indepth: yes
          config_timezone: America/Los_Angeles
          config_order: base.header, calendar, languages

          plugin_calendar: yes
          plugin_calendar_limit: 0

          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8

      - name: Dark metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: heykatie
          filename: github-metrics-dark.svg

          template: classic
          base: header
          base_indepth: yes
          config_timezone: America/Los_Angeles
          config_order: base.header, calendar, languages

          plugin_calendar: yes
          plugin_calendar_limit: 0

          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8

          extras_css: |
            :root {
              --color-calendar-graph-day-bg: #21262d !important;
            }

            body,
            .field,
            .field svg {
              color: #c9d1d9 !important;
            }

            h1,
            h2,
            h3,
            .field-title {
              color: #f0f6fc !important;
            }

            svg {
              background: #0d1117 !important;
            }
