name: GitHub Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Light metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: heykatie
          filename: github-metrics-light.svg
          output_action: commit

          template: classic
          base: header
          base_indepth: yes

          config_timezone: America/Los_Angeles
          config_order: base.header, languages, activity

          # Languages
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_analysis_timeout: 60
          plugin_languages_analysis_timeout_repositories: 10

          # Recent GitHub activity
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 30
          plugin_activity_visibility: public
          plugin_activity_filter: pr, review, issue, release

          # Keep the stats from base.header,
          # but remove its small contribution calendar
          extras_css: |
            .calendar {
              display: none !important;
            }

      - name: Dark metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: heykatie
          filename: github-metrics-dark.svg
          output_action: commit

          template: classic
          base: header
          base_indepth: yes

          config_timezone: America/Los_Angeles
          config_order: base.header, languages, activity

          # Languages
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_analysis_timeout: 60
          plugin_languages_analysis_timeout_repositories: 10

          # Recent GitHub activity
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 30
          plugin_activity_visibility: public
          plugin_activity_filter: push, pr, review, issue, release

          # Dark theme + remove the small contribution calendar
          extras_css: |
            .calendar {
              display: none !important;
            }

            :root {
              --color-calendar-graph-day-bg: #21262d !important;
            }

            svg {
              background: #0d1117 !important;
              color: #c9d1d9 !important;
            }

            body,
            .field,
            .field svg,
            small {
              color: #c9d1d9 !important;
            }

            h1,
            h2,
            h3,
            .field-title {
              color: #f0f6fc !important;
            }
